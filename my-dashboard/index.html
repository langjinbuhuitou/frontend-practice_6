<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>体育赛事数据看板</title>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #f5f7fa;
      font-family: "微软雅黑", sans-serif;
      padding: 30px 0;
    }
    .container { 
      width: 90%; 
      max-width: 1200px;
      margin: 0 auto; 
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 25px;
    }
    .filter-bar { 
      background: #fff;
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .filter-bar button { 
      padding: 8px 20px; 
      margin-right: 12px; 
      border: none;
      border-radius: 6px;
      background: #ecf0f1;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s;
    }
    .filter-bar button:hover {
      background: #aaddff;
    }
    .status-tip { 
      padding: 60px 20px; 
      text-align: center; 
      font-size: 18px; 
      color: #666;
      background: #fff;
      border-radius: 10px;
    }
    .cards { 
      display: flex; 
      gap: 20px; 
      margin-bottom: 25px; 
      flex-wrap: wrap; 
    }
    .card { 
      flex: 1;
      min-width: 180px;
      padding: 25px 20px; 
      background: #fff; 
      border-radius: 10px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      font-size: 17px;
      font-weight: 500;
      color: #2c3e50;
    }
    .chart-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .chart-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      padding: 20px;
      flex: 1;
      min-width: 450px;
    }
    #echartBox {
      width: 100%;
      height: 360px;
    }
    #chartjsBox {
      width: 100%;
      max-height: 300px; /* 直接限制饼图最大高度，自动缩小 */
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>体育赛事观赛人次看板</h1>
    <div class="filter-bar">
      <button class="filter-btn" data-type="all">全部赛事</button>
      <button class="filter-btn" data-type="足球">足球赛事</button>
      <button class="filter-btn" data-type="篮球">篮球赛事</button>
    </div>
    <div class="status-tip" id="statusArea">数据加载中...</div>
    <div class="cards" id="cardArea"></div>
    <div class="chart-row">
      <div class="chart-card">
        <div id="echartBox"></div>
      </div>
      <div class="chart-card">
        <canvas id="chartjsBox"></canvas>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
